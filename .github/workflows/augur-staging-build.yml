name: Create and Push Staging Docker

on:
  push:
    branches: ["staging"]
  # Build and push images only after changes are merged into staging.
  # No pull_request trigger to avoid publishing unmerged code.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging

    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: staging_build
          POSTGRES_PASSWORD: staging_build
          POSTGRES_DB: staging_build
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U staging_build -d staging_build"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Apply frontend Prisma migrations
        env:
          DATABASE_URL: postgresql://staging_build:staging_build@127.0.0.1:5432/staging_build
        run: npx --yes --package=prisma@6.12.0 prisma migrate deploy --schema=src/frontend/prisma/schema.prisma

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./src/api
          file: ./src/api/Dockerfile
          # Keep the build argument consistent with existing workflows.
          # The current API Dockerfile does not consume DATABASE_URL.
          build-args: DATABASE_URL=postgresql://staging_build:staging_build@127.0.0.1:5432/staging_build
          push: true
          tags: obellprat/augur-hakesch-api:staging

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/frontend/Dockerfile
          # Build connects only to the temporary PostgreSQL service.
          # Actual Staging DB credentials must be provided at runtime.
          build-args: DATABASE_URL=postgresql://staging_build:staging_build@127.0.0.1:5432/staging_build
          network: host
          allow: network.host
          push: true
          tags: obellprat/augur-hakesch-frontend:staging
