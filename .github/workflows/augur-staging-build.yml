name: Create and Push Staging Docker

on:
  push:
    branches: ["staging"]
  # Build and push images only after changes are merged into staging.
  # No pull_request trigger to avoid publishing unmerged code.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: actions/checkout@v4

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./src/api
          file: ./src/api/Dockerfile
          # Keep the build argument consistent with existing workflows.
          # The current API Dockerfile does not consume DATABASE_URL.
          build-args: DATABASE_URL=postgresql://staging_build:staging_build@127.0.0.1:5432/staging_build
          push: true
          tags: obellprat/augur-hakesch-api:staging

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/frontend/Dockerfile
          # Placeholder URL for Prisma generation during build.
          # Actual Staging DB credentials must be provided at runtime.
          build-args: DATABASE_URL=postgresql://staging_build:staging_build@127.0.0.1:5432/staging_build
          push: true
          tags: obellprat/augur-hakesch-frontend:staging
